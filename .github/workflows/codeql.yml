name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 12 * * 1" # every Monday at 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          # AlertSuppression makes `// codeql[rule-id]` comments take effect:
          # the default suites do not run it, so inline suppressions would be
          # ignored (the `js/file-access-to-http` suppressions at the doRequest
          # fetch sink are intentional and documented in docs/architecture.md
          # §5.3 — without this pack they silently do nothing).
          packs: codeql/javascript-queries:AlertSuppression.ql

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results

      # Dismiss alerts whose SARIF entry carries `suppressions[]` (i.e. the
      # inline `// lgtm`/`// codeql` comments matched via AlertSuppression).
      # Dismissal is a default-branch-only operation (alert state is global);
      # on PR branches this step is a no-op that just passes the ids through.
      - name: Dismiss suppressed alerts
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: advanced-security/dismiss-alerts@v2
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results/${{ matrix.language }}.sarif
        env:
          GITHUB_TOKEN: ${{ github.token }}
